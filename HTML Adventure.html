<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Adventure</title>
<style>
:root{
  --bg:#1d1650; --ink:#1c1650; --muted:#6b6896; --soft:#f4f2ff; --line:#d9d4ff;
  --yellow:#ffcf3f; --yellow-d:#d9a400; --mint:#2fd39a; --mint-d:#1a9f73;
  --coral:#ff5d73; --coral-d:#c93a50; --sky:#3fb6ff; --violet:#7c5cff; --violet-d:#5a3fd6;
  --code:#15122e;
  --mono:Consolas,"SF Mono",Menlo,"DejaVu Sans Mono","Courier New",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:18px;line-height:1.5;color:var(--ink);
  background:#1d1650;background-image:radial-gradient(circle at 12% 8%,#3b2bb5 0,transparent 38%),radial-gradient(circle at 92% 92%,#5b2aa0 0,transparent 34%);background-attachment:fixed}
:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
p{margin:0 0 .8em}
code{font-family:var(--mono);background:#ece8ff;color:#3a2aa8;padding:1px 7px;border-radius:7px;font-size:.92em}
button{font-family:inherit}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:rgba(18,13,56,.95);border-bottom:3px solid #0f0b33}
.brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:20px;white-space:nowrap}
.brand-mark{font-family:var(--mono);background:var(--yellow);color:var(--ink);border-radius:9px;padding:0 8px}
.progress{flex:1;min-width:200px;display:flex;gap:5px}
.seg{height:16px;background:rgba(255,255,255,.16);border-radius:8px;overflow:hidden;position:relative}
.seg i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .6s ease}
.seg.now{outline:2px solid #fff;outline-offset:1px}
.top-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.xp{background:#fff;color:var(--ink);font-weight:800;border-radius:999px;padding:3px 14px;min-width:78px;text-align:center}
.who{color:#d8d3ff;font-weight:700;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;width:44px;height:44px;border-radius:12px;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.26)}

main{max-width:1060px;margin:0 auto;padding:24px 16px 70px}

/* cards */
.card{background:#fff;border-radius:24px;padding:26px 28px;margin-bottom:22px;box-shadow:0 7px 0 #0f0b33}
.card.enter,.enter{animation:enter .35s ease both}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:14px}
.row.between{justify-content:space-between}
.chip{display:inline-block;font-weight:800;font-size:15px;padding:3px 12px;border-radius:999px;background:var(--soft);color:var(--violet-d)}
.chip.hot{background:#ffe9c2;color:#9b5c00}
.chip.sec{color:#fff}
.q{font-size:27px;margin:12px 0 14px}
.muted{color:var(--muted)}
.small{font-size:15px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:13px 26px;font-size:19px;font-weight:800;cursor:pointer;color:var(--ink);background:var(--yellow);box-shadow:0 5px 0 var(--yellow-d);transition:transform .08s,box-shadow .08s;min-height:50px}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--yellow-d)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--yellow-d)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.btn.mint:hover{box-shadow:0 7px 0 var(--mint-d)}
.btn.danger{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral-d)}
.btn.ghost{background:var(--soft);box-shadow:0 5px 0 var(--line);color:var(--violet-d)}
.btn.small{font-size:16px;padding:8px 16px;min-height:42px;border-radius:13px;box-shadow:0 4px 0 var(--line)}
.btn.big{font-size:24px;padding:18px 40px;border-radius:20px}

/* welcome */
.hero{text-align:center;padding:34px 24px 30px}
.title{font-size:clamp(40px,8vw,74px);font-weight:900;margin:6px 0 0;color:var(--ink);letter-spacing:-1px}
.title .br{color:var(--violet);font-family:var(--mono)}
.title .sl{color:var(--coral);font-family:var(--mono)}
.tagline{font-size:26px;font-weight:800;color:var(--violet-d);margin:0 0 18px}
.name-input{font:inherit;font-size:24px;font-weight:700;text-align:center;padding:14px 18px;border-radius:16px;border:4px solid var(--line);width:min(420px,100%);color:var(--ink);background:var(--soft)}
.name-input:focus{border-color:var(--violet);outline:none}
.lead{max-width:640px;margin:0 auto 20px;font-size:20px}
.mascot{display:flex;gap:14px;align-items:flex-start;text-align:left}
.face{flex:none;font-size:42px;width:66px;height:66px;display:grid;place-items:center;background:var(--yellow);border-radius:20px;box-shadow:0 4px 0 var(--yellow-d)}
.bubble{background:var(--soft);border-radius:18px;padding:12px 18px;flex:1}
.bubble p:last-child{margin:0}

/* choices */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 18px;border:3px solid var(--line);background:var(--soft);border-radius:16px;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;transition:transform .1s,border-color .1s,background .1s;min-height:64px}
.opt:hover:not(:disabled){border-color:var(--violet);transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt .key{flex:none;width:34px;height:34px;border-radius:10px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;color:var(--violet-d)}
.opt.right{background:#d6f7e8;border-color:var(--mint)}
.opt.right .key{background:var(--mint);color:#fff;border-color:var(--mint)}
.opt.wrong{background:#ffe3e7;border-color:var(--coral);animation:shake .4s}
.opt.wrong .key{background:var(--coral);color:#fff;border-color:var(--coral)}
.opt-code{display:inline-block;background:var(--code);color:#e8e6ff;font-family:var(--mono);font-size:19px;padding:5px 12px;border-radius:10px;font-weight:600;white-space:pre}
.opt-html{background:#fff;color:#111;font-family:Georgia,"Times New Roman",serif;font-weight:400;padding:4px 14px;border-radius:8px;border:2px solid #e3e0ff;width:100%}
.opt-html ul,.opt-html ol{margin:6px 0}

.fb{margin-top:20px;padding:16px 20px;border-radius:18px;animation:enter .3s ease both}
.fb.good{background:#e3faf0;border-left:10px solid var(--mint)}
.fb.bad{background:#fff0f2;border-left:10px solid var(--coral)}
.fb-head{font-size:26px;font-weight:900;margin-bottom:4px}
.fb.good .fb-head{color:#12805c}
.fb.bad .fb-head{color:#b8283d}
.pts{font-weight:800;color:var(--violet-d)}

/* code */
.code-block{background:var(--code);color:#e8e6ff;border-radius:16px;padding:16px 20px;font-family:var(--mono);font-size:20px;line-height:1.6;white-space:pre;overflow:auto;margin:12px 0;border:3px solid #0b0922}
.t-br{color:#9a96d6}.t-tag{color:#ff7b9c;font-weight:700}.t-attr{color:#ffd36b}.t-val{color:#7ee2a8}.t-com{color:#7d79ad;font-style:italic}

.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.mission{margin:8px 0 0;padding-left:0;list-style:none;counter-reset:m}
.mission li{counter-increment:m;position:relative;padding:6px 0 6px 40px}
.mission li::before{content:counter(m);position:absolute;left:0;top:6px;width:28px;height:28px;border-radius:50%;background:var(--violet);color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px}
.editor{position:relative;height:calc(var(--rows,10)*1.6em + 28px);font-size:18px;border-radius:16px;overflow:hidden;background:var(--code);border:3px solid #0b0922}
.editor pre,.editor textarea{position:absolute;inset:0;margin:0;padding:14px;font:inherit;font-family:var(--mono);line-height:1.6;white-space:pre;tab-size:2;border:0}
.editor pre{color:#e8e6ff;overflow:hidden;pointer-events:none}
.editor pre code{background:none;color:inherit;padding:0;font-size:inherit;border-radius:0}
.editor textarea{background:transparent;color:transparent;caret-color:#fff;resize:none;overflow:auto;outline:none;width:100%;height:100%}
.editor textarea::selection{background:rgba(124,92,255,.55);color:transparent}
.editor.locked{opacity:.85}
.pv{border:3px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.pv-bar{background:var(--soft);padding:6px 14px;font-weight:800;color:var(--violet-d);font-size:15px}
.pv-frame{width:100%;border:0;display:block;background:#fff}
.paper{background:#fff;color:#111;font-family:Georgia,"Times New Roman",serif;border:3px dashed #cfc9ff;border-radius:12px;padding:10px 18px;font-size:16px;line-height:normal}
.paper img{max-width:150px}
.tip{background:#fff8dc;border:3px dashed var(--yellow);border-radius:16px;padding:10px 16px;margin:12px 0}
.hint-wrap{margin:12px 0}
.hint-note{font-size:14px;color:var(--muted);margin-left:10px}
.hint-text{margin-top:10px;background:#fff8dc;border-left:8px solid var(--yellow);border-radius:12px;padding:10px 16px;animation:enter .3s ease both}
.crit{display:flex;gap:10px;padding:8px 0;border-bottom:2px dashed #eee;align-items:flex-start}
.crit .ic{flex:none;width:28px}
.crit .pp{margin-left:auto;font-weight:800;white-space:nowrap}
.crit.ok .pp{color:#12805c}.crit.no .pp{color:#b8283d}.crit.part .pp{color:#9b5c00}

/* match question */
.mrow{display:flex;gap:12px;align-items:center;margin:10px 0;flex-wrap:wrap}
.mrow .arrow{color:var(--muted)}
select.sel{font:inherit;font-size:18px;font-weight:700;padding:10px 12px;border-radius:12px;border:3px solid var(--line);background:#fff;color:var(--ink);min-width:230px;max-width:100%}
select.sel.right{border-color:var(--mint);background:#d6f7e8}
select.sel.wrong{border-color:var(--coral);background:#ffe3e7;animation:shake .4s}

/* mini-games */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin-top:14px}
.mcol{display:flex;flex-direction:column;gap:12px}
.mcard{border:3px solid var(--line);background:var(--soft);border-radius:16px;padding:12px 16px;font-size:19px;font-weight:700;cursor:pointer;text-align:left;color:var(--ink);min-height:62px;display:flex;align-items:center;transition:transform .1s}
.mcard:hover{transform:translateY(-2px);border-color:var(--violet)}
.mcard.tag{font-family:var(--mono);font-size:22px;justify-content:center;background:var(--code);color:#ff7b9c;border-color:#0b0922}
.mcard.sel{outline:5px solid var(--yellow);transform:scale(1.03)}
.mcard.matched{background:#d6f7e8;border-color:var(--mint);color:var(--ink);animation:pop .5s ease;pointer-events:none;opacity:.8}
.mcard.tag.matched{background:var(--mint);color:var(--ink)}
.mcard.shake{animation:shake .4s}
.build-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.line{display:flex;align-items:center;gap:4px;margin:8px 0;font-family:var(--mono);font-size:19px;flex-wrap:wrap}
.line.fixed{color:#7d79ad;padding:4px 0}
.slot{min-width:120px;min-height:46px;border:3px dashed #b9b1ff;border-radius:12px;background:var(--soft);padding:4px 12px;font-family:var(--mono);font-size:18px;display:inline-flex;align-items:center;cursor:pointer;color:var(--muted);font-weight:700}
.slot.filled{border-style:solid;background:var(--code);color:#ff7b9c;border-color:#0b0922}
.slot.over{background:#fff3c4}
.slot.ok{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint)}
.slot.bad{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral);animation:shake .4s}
.line .txt{color:var(--ink);font-family:Georgia,serif}
.palette{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.tag-block{font-family:var(--mono);font-size:20px;font-weight:800;background:var(--code);color:#ffd36b;border:3px solid #0b0922;border-radius:12px;padding:8px 16px;cursor:grab;box-shadow:0 4px 0 #0b0922;min-height:46px}
.tag-block.picked{outline:5px solid var(--yellow);transform:translateY(-3px)}
.chunk{cursor:pointer;border-radius:6px;padding:2px 1px;border-bottom:3px dotted transparent}
.chunk:hover{background:rgba(255,255,255,.18);border-bottom-color:#9a96d6}
.chunk.wrong{background:rgba(255,93,115,.5);animation:shake .4s}
.chunk.found{background:rgba(47,211,154,.55)}
.chunk.reveal{background:rgba(255,207,63,.5)}
.dots{display:flex;gap:6px;margin:8px 0}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--mint)}.dots i.cur{background:var(--yellow)}

/* results */
.ring{--p:0;width:220px;height:220px;border-radius:50%;background:conic-gradient(var(--mint) calc(var(--p)*1%),#e6e2ff 0);display:grid;place-items:center;margin:0 auto}
.ring-in{width:170px;height:170px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1.1}
.big-score{font-size:46px;font-weight:900}
.badge{display:inline-flex;gap:10px;align-items:center;font-size:30px;font-weight:900;background:var(--yellow);padding:8px 24px;border-radius:999px;box-shadow:0 5px 0 var(--yellow-d);animation:levelup .9s ease both}
.bars{display:grid;gap:12px;margin-top:10px}
.bar-row{display:grid;grid-template-columns:190px 1fr 56px;gap:12px;align-items:center}
.bar-label{font-weight:800}
.track{height:24px;border-radius:12px;background:#ece8ff;overflow:hidden}
.fill{height:100%;width:0;border-radius:12px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar-val{font-weight:800;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
ul.nice{list-style:none;padding:0;margin:0}
ul.nice li{padding:6px 0 6px 34px;position:relative}
ul.nice li::before{content:attr(data-i);position:absolute;left:0}
table.tbl{width:100%;border-collapse:collapse;font-size:16px}
table.tbl th,table.tbl td{padding:8px 10px;border-bottom:2px solid #eee;text-align:left}
table.tbl th{background:var(--soft);color:var(--violet-d)}
details.code-d{margin:6px 0}
details.code-d pre{background:var(--code);color:#e8e6ff;padding:12px;border-radius:10px;overflow:auto;font-family:var(--mono);font-size:15px}
.recommend{background:#f1eeff;border-left:10px solid var(--violet);border-radius:16px;padding:14px 20px;font-size:19px}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,8,40,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:22px;max-width:540px;width:100%;padding:24px 26px;max-height:88vh;overflow:auto;box-shadow:0 7px 0 #0f0b33}
.modal textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:var(--ink);font-weight:800;padding:12px 22px;border-radius:999px;box-shadow:0 5px 0 #0f0b33;z-index:60;animation:enter .25s ease both}
.cf{position:fixed;top:-16px;width:10px;height:15px;z-index:40;pointer-events:none;animation:fall 3.2s linear forwards}

@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes levelup{0%{transform:scale(.3) rotate(-8deg);opacity:0}60%{transform:scale(1.15) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 var(--line)}50%{box-shadow:0 5px 0 var(--yellow),0 0 0 5px rgba(255,207,63,.5)}}
.btn.pulse{animation:pulse 1.6s ease infinite}

@media (max-width:880px){
  .split,.build-grid,.two{grid-template-columns:1fr}
  .opts,.mgrid{grid-template-columns:1fr}
  .bar-row{grid-template-columns:130px 1fr 50px}
  .card{padding:20px 18px}
  .q{font-size:23px}
}
@media (max-width:560px){ body{font-size:17px} .who{display:none} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<header id="topbar" class="topbar" hidden>
  <div class="brand"><span class="brand-mark">&lt;/&gt;</span><span>HTML Adventure</span></div>
  <div id="progress" class="progress" role="progressbar" aria-label="Adventure progress"></div>
  <div class="top-right">
    <span id="who" class="who"></span>
    <span id="xp" class="xp" title="Your stars">⭐ 0</span>
    <button id="btn-sound" class="icon-btn" type="button" aria-label="Turn sound on or off" title="Sound on/off">🔊</button>
    <button id="btn-new" class="icon-btn" type="button" aria-label="Start a new student" title="Start new student">↺</button>
  </div>
</header>
<main id="main"></main>
<div id="modal-root"></div>
<script>
'use strict';

// =====================================================================
// UI HELPERS
// =====================================================================
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// text with `code` pieces -> safe html
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtPts = n => { n = Math.round(n * 10) / 10; return Number.isInteger(n) ? String(n) : n.toFixed(1); };
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const wordCount = s => norm(s).split(' ').filter(Boolean).length;
const CMT = '<!' + '-- Type your HTML here --' + '>';

// syntax colouring for HTML code (input is raw text, output is safe HTML)
function hl(src) {
  const s = esc(src);
  return s.replace(/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?)([A-Za-z!][\w-]*)((?:(?!&gt;)[\s\S])*?)(\/?&gt;)/g, (m, com, open, name, attrs, end) => {
    if (com) return '<span class="t-com">' + com + '</span>';
    const a = attrs.replace(/([\w:-]+)(=)("[^"]*"|'[^']*')/g, '<span class="t-attr">$1</span>$2<span class="t-val">$3</span>');
    return '<span class="t-br">' + open + '</span><span class="t-tag">' + name + '</span>' + a + '<span class="t-br">' + end + '</span>';
  });
}
const codeBlock = src => h('div', { class: 'code-block', html: hl(src) });
function clearMain() { const m = $('#main'); m.innerHTML = ''; window.scrollTo(0, 0); return m; }

function toast(msg) {
  const t = h('div', { class: 'toast', role: 'status' }, msg);
  document.body.append(t); setTimeout(() => t.remove(), 2600);
}
function confirmBox(msg, yes = 'Yes', no = 'Cancel', opts = {}) {
  return new Promise(res => {
    const ov = h('div', { class: 'overlay' });
    const onKey = e => { if (e.key === 'Escape') close(false); };
    const close = v => { ov.remove(); document.removeEventListener('keydown', onKey); res(v); };
    const yesB = h('button', { class: 'btn' + (opts.danger ? ' danger' : ''), type: 'button', onclick: () => close(true) }, yes);
    ov.append(h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' },
      h('h3', null, opts.title || 'Are you sure?'), h('p', null, msg),
      h('div', { class: 'row end' }, h('button', { class: 'btn ghost', type: 'button', onclick: () => close(false) }, no), yesB)));
    $('#modal-root').append(ov); document.addEventListener('keydown', onKey); yesB.focus();
  });
}
function textModal(title, text) {
  const ov = h('div', { class: 'overlay' });
  const ta = h('textarea', { readonly: true }); ta.value = text;
  ov.append(h('div', { class: 'modal' }, h('h3', null, title), h('p', { class: 'small' }, 'Select all the text and copy it:'), ta,

const STEPS = [];
(function buildSteps() {
  const add = (sec, type, id, extra) => STEPS.push(Object.assign({ id, sec, type }, extra));
  SECTIONS.forEach(s => add(s.id, 'intro', s.id + '-intro'));
  const at = (sec, idx) => { let n = 0; for (let i = 0; i < STEPS.length; i++) { if (STEPS[i].sec === sec) { if (n === idx) return i; n++; } } return STEPS.length; };
  const ins = (sec, step) => { // insert after the last step of that section
    let last = -1; STEPS.forEach((x, i) => { if (x.sec === sec) last = i; }); STEPS.splice(last + 1, 0, step);
  };
  QUIZ.forEach(q => ins('s1', { id: q.id, sec: 's1', type: 'quiz', data: q }));
  READ.forEach(r => ins('s2', { id: r.id, sec: 's2', type: 'read', data: r }));
  [['c1', taskA], ['c2', taskB], ['c3', taskC]].forEach(([id, fn]) => ins('s3', { id, sec: 's3', type: 'code', make: fn }));
  ins('s4', { id: 'b1', sec: 's4', type: 'bug', slot: BUGMC.b1 });
  ins('s4', { id: 'b2', sec: 's4', type: 'bug', slot: BUGMC.b2 });
  ins('s4', { id: 'b3', sec: 's4', type: 'code', make: fixUl });
  ins('s4', { id: 'b4', sec: 's4', type: 'code', make: fixLink });
  ins('s4', { id: 'b5', sec: 's4', type: 'bug', slot: BUGMC.b5 });
  ins('s5', { id: 'g1', sec: 's5', type: 'match' });
  ins('s5', { id: 'g2', sec: 's5', type: 'build' });
  ins('s5', { id: 'g3', sec: 's5', type: 'detect' });
  ins('s6', { id: 'f1', sec: 's6', type: 'code', make: taskFinal });
  // sort so each section's intro comes first and sections are in order
  const order = SECTIONS.map(s => s.id);
  const intro = x => x.type === 'intro' ? 0 : 1;
  const stable = STEPS.map((x, i) => [x, i]).sort((a, b) => order.indexOf(a[0].sec) - order.indexOf(b[0].sec) || intro(a[0]) - intro(b[0]) || a[1] - b[1]).map(p => p[0]);
  STEPS.length = 0; stable.forEach(x => STEPS.push(x));
})();
const playable = () => STEPS.filter(s => s.type !== 'intro');

// SCORING
// =====================================================================
function finalizeResult(step, res) {
  res.max = Math.round(res.max * 100) / 100;
  if (res.hint && res.earned > res.max * HINT_CAP) {
    const f = (res.max * HINT_CAP) / res.earned;
    res.earned = res.max * HINT_CAP;
    Object.keys(res.skills).forEach(k => { res.skills[k][0] *= f; });
    res.capped = true;
  }
  res.earned = Math.round(res.earned * 100) / 100;
  Object.keys(res.skills).forEach(k => { res.skills[k][0] = Math.round(res.skills[k][0] * 100) / 100; });
  (res.mistakes || []).forEach(m => { m.sec = SECTION[step.sec].name; });
  res.title = res.title || step.id;
  state.results[step.id] = res;
  if (!state.order.includes(step.id)) state.order.push(step.id);
  save(); updateHeader(true);
  return res;
}
function computeScores() {
  const sec = {}, sk = {};
  SECTIONS.forEach(s => { sec[s.id] = { e: 0, m: 0 }; });
  STEPS.forEach(st => {
    const r = state.results[st.id]; if (!r) return;
    sec[st.sec].e += r.earned; sec[st.sec].m += r.max;
    Object.entries(r.skills || {}).forEach(([k, [e, m]]) => { sk[k] = sk[k] || { e: 0, m: 0 }; sk[k].e += e; sk[k].m += m; });
  });
  const sections = SECTIONS.map(s => ({ id: s.id, name: s.name, short: s.short, weight: s.weight, color: s.color, e: sec[s.id].e, m: sec[s.id].m, pct: sec[s.id].m ? sec[s.id].e / sec[s.id].m * 100 : 0 }));
  const total = sections.reduce((a, s) => a + s.weight * s.pct / 100, 0);
  const skills = SKILLS.filter(k => sk[k] && sk[k].m > 0).map(k => ({ name: k, e: sk[k].e, m: sk[k].m, pct: sk[k].e / sk[k].m * 100 }));
  return { sections, skills, total };
}
const xpNow = () => Math.round(Object.values(state.results).reduce((a, r) => a + r.earned, 0) * 10);
function tierFor(step) {
  if (state.tiers[step.id]) return state.tiers[step.id];
  const rec = state.order.slice(-5).map(id => state.results[id]).filter(Boolean).map(r => r.earned / r.max);
  let t = 'normal';
  if (rec.length >= 3) { const avg = rec.reduce((a, b) => a + b, 0) / rec.length; if (avg >= 0.85) t = 'hard'; else if (avg <= 0.5) t = 'easy'; }
  state.tiers[step.id] = t; save(); return t;
}

function progressInfo() {
  return SECTIONS.map(s => {
    const items = playable().filter(x => x.sec === s.id);

  });

function updateHeader(animate) {
  const top = $('#topbar'); top.hidden = state.screen === 'welcome';

    const f = h('i'); f.style.background = i.s.color; f.style.width = (i.done / i.total * 100) + '%'; seg.append(f); p.append(seg);
  });

  $('#who').textContent = state.name ? '👤 ' + state.name : '';

function makeEditor({ value, rows, onInput }) {
  const wrap = h('div', { class: 'editor' }); wrap.style.setProperty('--rows', rows || 10);
  const code = h('code'), pre = h('pre', { 'aria-hidden': 'true' }, code);
  const ta = h('textarea', { spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off', wrap: 'off', 'aria-label': 'Type your HTML code here' });
  ta.value = value || '';
  const sync = () => { code.innerHTML = hl(ta.value) + '\n'; pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; };
  ta.addEventListener('input', () => { sync(); if (onInput) onInput(ta.value); });
  ta.addEventListener('scroll', () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; });
  ta.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey || e.ctrlKey || e.metaKey) return;
    const v = ta.value, pos = ta.selectionStart, ls = v.lastIndexOf('\n', pos - 1) + 1;
    const ind = (v.slice(ls, pos).match(/^[ \t]*/) || [''])[0];
    if (ind) { e.preventDefault(); ta.setRangeText('\n' + ind, pos, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
  });
  wrap.append(pre, ta); sync();
  return { el: wrap, ta, get value() { return ta.value; }, set(v) { ta.value = v; sync(); if (onInput) onInput(v); }, lock() { ta.readOnly = true; wrap.classList.add('locked'); } };
}
const EMOJI = [[/cat|kitten/, '🐱'], [/dog|puppy/, '🐶'], [/fish/, '🐟'], [/lion/, '🦁'], [/bird|parrot/, '🐦'], [/horse/, '🐴'], [/pizza/, '🍕'], [/pasta|spaghetti/, '🍝'], [/apple/, '🍎'], [/rabbit|bunny/, '🐰'],
  [/panda/, '🐼'], [/elephant/, '🐘'], [/monkey/, '🐵'], [/tiger/, '🐯'], [/turtle/, '🐢'], [/dolphin|whale/, '🐬'], [/snake/, '🐍'], [/frog/, '🐸'], [/bear/, '🐻'], [/car/, '🚗'], [/robot|game/, '🤖'], [/logo|school|house/, '🏠']];
function placeholderSrc(hintText) {
  const t = String(hintText || '').toLowerCase(); let em = '🖼️';
  for (const [re, e] of EMOJI) if (re.test(t)) { em = e; break; }
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='150' viewBox='0 0 200 150'><rect width='200' height='150' rx='16' fill='#dfe7ff'/><text x='100' y='98' font-size='70' text-anchor='middle'>" + em + '</text></svg>';

// Turns the student's HTML into a safe page. It is shown in a sandboxed iframe (no scripts, no network).
function previewDoc(src) {
  const doc = new DOMParser().parseFromString(src, 'text/html');
  doc.querySelectorAll('script,iframe,frame,frameset,object,embed,link,meta,base,form,input,button,select,textarea,style,noscript,audio,video,svg,math,template').forEach(n => n.remove());
  doc.body.querySelectorAll('*').forEach(el => {
    Array.from(el.attributes).forEach(a => {
      const n = a.name.toLowerCase();
      if (n.startsWith('on') || n === 'srcdoc' || n === 'srcset' || n === 'formaction') el.removeAttribute(a.name);
      else if ((n === 'href' || n === 'src') && /^\s*(javascript|vbscript|data:text)/i.test(a.value)) el.removeAttribute(a.name);
    });

  doc.body.querySelectorAll('img').forEach(img => {

  const tbl = (head, rows) => h('table', { class: 'tbl' }, h('thead', null, h('tr', null, head.map(x => h('th', null, x)))), h('tbody', null, rows.map(r => h('tr', null, r.map(c => h('td', null, c))))));
  main.append(
    h('section', { class: 'card enter' }, h('div', { class: 'row between' }, h('h2', { style: 'margin:0' }, '👩‍🏫 Teacher report'),
      h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: () => copyText(f.report) }, '📋 Copy Results'), h('button', { class: 'btn ghost', type: 'button', onclick: () => { state.screen = 'results'; render(); } }, 'Back'))),
      tbl(['Student', 'Date / time', 'Score', 'Percentage', 'Level'], [[f.name, new Date(f.date).toLocaleString(), f.score + ' / 100', f.pct + '%', f.level.name]])),
    h('section', { class: 'card' }, h('h3', null, 'Section scores'), tbl(['Section', 'Weight', 'Points', 'Score'], f.sections.map(s => [s.name, s.weight + '%', fmtPts(s.e) + ' / ' + fmtPts(s.m), Math.round(s.pct) + '%']))),
    h('section', { class: 'card' }, h('h3', null, 'Skill scores'), tbl(['Skill', 'Points', 'Score'], f.skills.map(s => [s.name, fmtPts(s.e) + ' / ' + fmtPts(s.m), Math.round(s.pct) + '%']))),
    h('section', { class: 'card' }, h('h3', null, 'Coding task results'),
      f.tasks.map(t => h('div', { style: 'margin-bottom:16px' }, h('strong', null, t.title + ' — ' + fmtPts(t.e) + ' / ' + fmtPts(t.m)),
        (t.items || []).map(i => h('div', { class: 'crit ' + (i.got >= i.pts ? 'ok' : i.got > 0 ? 'part' : 'no') }, h('span', { class: 'ic' }, i.got >= i.pts ? '✅' : i.got > 0 ? '🟡' : '❌'), h('span', { html: fmt(i.label) }), h('span', { class: 'pp' }, fmtPts(i.got) + ' / ' + i.pts))),
        h('details', { class: 'code-d' }, h('summary', null, 'Show the student’s code'), h('pre', null, t.code || ''))))),
    h('section', { class: 'card' }, h('h3', null, 'Mistakes (' + f.mistakes.length + ')'),
      f.mistakes.length ? h('ul', null, f.mistakes.map(m => h('li', null, h('strong', null, m.sec + ': '), m.text))) : h('p', null, 'No mistakes recorded. 🎉'),
      h('h3', null, 'Hints used: ' + f.hints.length), f.hints.length ? h('p', null, f.hints.join(' · ')) : null,
      h('h3', null, 'Recommended topics for revision'), h('p', null, f.topics.length ? f.topics.join(' · ') : 'None'),
      h('h3', null, 'Recommendation'), h('div', { class: 'recommend' }, f.recommendation)));
}

function init() {
  loadSaved();
  $('#btn-sound').addEventListener('click', () => { state.sound = !state.sound; save(); updateHeader(false); SFX.click(); });
  $('#btn-new').addEventListener('click', startOver);
  render();
}
init();
</script>
